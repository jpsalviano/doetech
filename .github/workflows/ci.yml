name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Testes de integração da API contra um Postgres de verdade.
  api:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_PASSWORD: dev }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DOETECH_TEST_DB: Host=localhost;Username=postgres;Password=dev
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: 9.0.x }
      - run: dotnet test tests/DoeTech.Tests

  web:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npx ng build --base-href /doetech/

  mobile:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo export --platform web --output-dir dist

  # Uma imagem com a API e os dois fronts; de main vai para o GHCR com o
  # commit como tag, e o jpsalviano.com.br a fixa por essa tag.
  image:
    timeout-minutes: 30
    needs: [api, web, mobile]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/jpsalviano/doetech:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # APK Android: prebuild do projeto nativo e build com Gradle (sem conta na
  # Expo). De main, substitui o APK da release `android`.
  android:
    timeout-minutes: 40
    needs: [mobile]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - uses: gradle/actions/setup-gradle@v6
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      # Assinado com a chave de debug do template: serve para instalar
      # direto, não para loja.
      - run: ./gradlew assembleRelease --no-daemon
        working-directory: mobile/android
      - uses: actions/upload-artifact@v7
        with:
          name: doetech-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
      - if: github.ref == 'refs/heads/main'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk doetech.apk
          gh release view android >/dev/null 2>&1 || gh release create android --title "Android (último build de main)" --notes "APK gerado pelo CI a cada push em main."
          gh release upload android doetech.apk --clobber
          gh release edit android --notes "APK gerado pelo CI a partir de ${GITHUB_SHA::7}."
